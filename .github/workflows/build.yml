name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

env:
  PLUGIN_VERSION: 1.6.2-omp

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            artifact_suffix: win32
          - arch: x64
            artifact_suffix: win64
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/pawnraknet.dll dist/
          cp src/Pawn.RakNet.inc dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawnraknet-${{ env.PLUGIN_VERSION }}-${{ matrix.artifact_suffix }}
          path: dist/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cflags: "-m32"
            apt_extra: "g++-multilib"
            artifact_suffix: linux
          - arch: x64
            cflags: ""
            apt_extra: ""
            artifact_suffix: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install packages
        if: matrix.apt_extra != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_extra }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_FLAGS="${{ matrix.cflags }}" -DCMAKE_CXX_FLAGS="${{ matrix.cflags }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/pawnraknet.so dist/
          cp src/Pawn.RakNet.inc dist/
          tar -czf pawnraknet-$PLUGIN_VERSION-${{ matrix.artifact_suffix }}.tar.gz -C dist pawnraknet.so Pawn.RakNet.inc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawnraknet-${{ env.PLUGIN_VERSION }}-${{ matrix.artifact_suffix }}
          path: pawnraknet-${{ env.PLUGIN_VERSION }}-${{ matrix.artifact_suffix }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package windows artifacts
        run: |
          cd artifacts
          for d in pawnraknet-*-win32 pawnraknet-*-win64; do
            if [ -d "$d" ]; then
              (cd "$d" && zip -r "../${d}.zip" .)
            fi
          done
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/pawnraknet-*-win32.zip
            artifacts/pawnraknet-*-win64.zip
            artifacts/pawnraknet-*-linux/pawnraknet-*-linux.tar.gz
            artifacts/pawnraknet-*-linux-x64/pawnraknet-*-linux-x64.tar.gz
